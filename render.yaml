services:
  # LOANORBIT FastAPI Backend Web Service
  - type: web
    name: loanorbit-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: IS_SANDBOX_DEMO
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: loanorbit-postgres
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: STORAGE_DIR
        value: /tmp/storage/private

databases:
  # LOANORBIT Managed PostgreSQL Database
  - name: loanorbit-postgres
    databaseName: loanorbit_db
    user: loanorbit_user
    plan: free
    region: oregon
